<!doctype html>
<!-- Developer page: one agent with a desk and chair on a clean stage, to check poses up close.
     ?state=sit|type|stand|walk|wave|talk  &view=side|front|back|top  &id=<agent id> -->
<meta charset="utf-8">
<title>Rig test</title>
<style>html,body{margin:0;height:100%;background:#d9d6d0;overflow:hidden}canvas{display:block}#i{position:fixed;left:8px;top:6px;font:12px/1.4 ui-monospace,monospace;color:#222;white-space:pre}</style>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<div id="i"></div>
<script type="module">
import * as THREE from 'three';
import { makeFurniture } from '/js/furniture.js';
import { loadAssets, buildFbxRig, FURNITURE_SCALE as FS } from '/js/assets3d.js';

const q = new URLSearchParams(location.search);
const state = q.get('state') || 'sit', view = q.get('view') || 'side', id = q.get('id') || 'aria';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xd9d6d0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8478, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(3, 6, 4); scene.add(sun);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 50);
const grid = new THREE.GridHelper(4, 16, 0x777777, 0xb5b0a8); scene.add(grid);
// height marks every 0.25 m
for (let y = 0.25; y <= 1.75; y += 0.25) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.004, 1.6), new THREE.MeshBasicMaterial({ color: y % 0.5 ? 0x999999 : 0x444444 })); m.position.set(-0.9, y, 0); scene.add(m); }

const F = makeFurniture();
const sitting = state === 'sit' || state === 'type';
// same layout as the office: desk at the origin, chair 0.68 m in front of it (+z), agent faces the desk (-z)
const set = new THREE.Group(); set.scale.setScalar(FS); scene.add(set);
const desk = F.desk({}); set.add(desk);
const chair = F.officeChair(F.M.leather); chair.position.set(0, 0, 0.68); set.add(chair);
await loadAssets();
const P = buildFbxRig({ id, name: id }, '#b59a73');
P.body.position.set(0, 0, sitting ? 0.66 * FS : 1.2); P.g.rotation.y = Math.PI; scene.add(P.body);
const now0 = performance.now();
const a = { path: state === 'walk' ? [1] : [], moving: false, running: false, pose: sitting ? 'sit' : 'stand', mode: sitting ? 'desk' : 'free', desk: sitting ? {} : null, e: { status: state === 'type' ? 'working' : 'idle' }, lod: 0, gest: null, waveUntil: state === 'wave' ? Infinity : 0, talkUntil: state === 'talk' ? Infinity : 0, g: P.g };
window.__rig = { P, a, scene, camera, chair, desk };
const tz = sitting ? 0.66 * FS : 1.2;
const cams = { side: [2.6, 0.7, tz], front: [0, 0.7, tz - 2.6], back: [0, 0.8, tz + 2.6], top: [0.01, 3.4, tz], q: [1.9, 1.1, tz + 1.9] };
camera.position.set(...cams[view]); camera.lookAt(0, 0.5, tz - 0.15);
function frame() {
  requestAnimationFrame(frame);
  if (state === 'type') { const t = performance.now(); P.armL.s.rotation.x = P.armR.s.rotation.x = -0.5; P.armL.el.rotation.x = -1.0 + Math.sin(t * 0.021) * 0.09; P.armR.el.rotation.x = -1.0 + Math.cos(t * 0.019) * 0.09; }
  P.rig.apply(a);
  renderer.render(scene, camera);
}
frame();
// numbers for the same pose: joint heights above the floor (metres)
setTimeout(() => {
  const y = (n) => { let b = null; P.g.traverse((o) => { if (o.isBone && o.name === n) b = o; }); return b ? b.getWorldPosition(new THREE.Vector3()) : null; };
  const out = {}; for (const n of ['Head', 'Hips', 'UpperLegL', 'LowerLegL', 'FootL', 'PalmL', 'UpperArmL']) { const v = y(n); if (v) out[n] = [+(v.x).toFixed(2), +v.y.toFixed(3), +(v.z).toFixed(2)]; }
  // lowest and highest skinned vertex, and the lowest point of the pelvis area (under the hips)
  let sk = null; P.g.traverse((o) => { if (o.isSkinnedMesh) sk = o; });
  const v = new THREE.Vector3(); let lo = 9, hi = -9, seatLo = 9; const hips = y('Hips');
  const pos = sk.geometry.attributes.position;
  for (let i = 0; i < pos.count; i += 3) { v.fromBufferAttribute(pos, i); sk.applyBoneTransform(i, v); v.applyMatrix4(sk.matrixWorld); lo = Math.min(lo, v.y); hi = Math.max(hi, v.y); if (Math.abs(v.x - hips.x) < 0.12 && Math.abs(v.z - hips.z) < 0.14 && v.y < hips.y) seatLo = Math.min(seatLo, v.y); }
  out.lowestVertex = +lo.toFixed(3); out.highestVertex = +hi.toFixed(3); out.pelvisBottom = +seatLo.toFixed(3); out.seatTop = +(0.49 * FS).toFixed(3); out.deskTop = +(0.75 * FS).toFixed(3);
  window.__measure = out;
  document.getElementById('i').textContent = `${state} · ${view}\n` + JSON.stringify(out, null, 1);
}, 1500);
</script>
